services:
  openwa-automation:
    build: .
    container_name: openwa-automation
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      COUNTRY_CODE: ${COUNTRY_CODE:-34}
      OPENWA_SESSION_ID: ${OPENWA_SESSION_ID:-number-automation}
    volumes:
      - automation-data:/app/data
      - openwa-session:/app/.open-wa

volumes:
  automation-data:
  openwa-session:
